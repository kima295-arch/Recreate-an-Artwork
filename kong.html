<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kong Play - Interactive Study</title>

  <style>
    /* Basic page style */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f2f1ed;
      color: #282722;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 28px 34px 36px;
      position: relative;
      overflow: hidden;
      background: #f5f4f0;
    }

    .note {
      margin: 0;
      font-size: 12px;
      line-height: 1.45;
      letter-spacing: 1px;
    }

    .artwork {
      position: relative;
      width: 100%;
      max-width: 1400px;
      height: 760px;
      margin: 12px auto 0;
    }

    /* White platforms */
    .platform {
      position: absolute;
      background: #fff;
      border: 1px solid #d7d5cf;
      box-shadow: 0 7px 0 #dedcd6, 0 11px 17px rgba(55, 49, 40, 0.15);
    }

    .one {
      width: 29%;
      height: 31%;
      left: 12%;
      top: 8%;
      border-radius: 47% 53% 58% 42%;
      transform: rotate(-9deg);
    }

    .two {
      width: 21%;
      height: 28%;
      left: 62%;
      top: 6%;
      border-radius: 50%;
      transform: rotate(7deg);
    }

    .three {
      width: 14%;
      height: 15%;
      left: 46%;
      top: 13%;
      border-radius: 50%;
    }

    .four {
      width: 34%;
      height: 26%;
      left: 32%;
      top: 42%;
      border-radius: 47% 53% 42% 58%;
      transform: rotate(-10deg);
    }

    .five {
      width: 25%;
      height: 28%;
      left: 75%;
      top: 42%;
      border-radius: 48% 52% 54% 46%;
      transform: rotate(9deg);
    }

    .six {
      width: 28%;
      height: 31%;
      left: 31%;
      top: 70%;
      border-radius: 50%;
      transform: rotate(6deg);
    }

    .seven {
      width: 24%;
      height: 22%;
      left: 68%;
      top: 75%;
      border-radius: 50%;
      transform: rotate(-7deg);
    }

    .eight {
      width: 19%;
      height: 25%;
      left: 2%;
      top: 55%;
      border-radius: 50%;
      transform: rotate(8deg);
    }

    /* Round colorful balls */
    .ball {
      --ball-color: #f04450;
      --dark-color: #a82336;
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      cursor: pointer;
      background: radial-gradient(circle at 30% 23%, white, var(--ball-color) 40%, var(--dark-color));
      box-shadow: inset -5px -7px 9px rgba(35, 26, 30, 0.23),
                  inset 3px 3px 7px rgba(255, 255, 255, 0.38),
                  3px 7px 8px rgba(47, 42, 35, 0.24);
      transform-origin: center bottom;
    }

    /* Small hole on top of each ball */
    .ball::before {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      left: 37.5%;
      top: 9%;
      border-radius: 50%;
      background: #20252b;
      border: 3px solid var(--ball-color);
    }

    /* Small shine mark */
    .ball::after {
      content: "";
      position: absolute;
      width: 14%;
      height: 5%;
      left: 24%;
      top: 29%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      transform: rotate(-35deg);
    }

    /* Jiggle when the mouse is over a ball */
    .ball:hover {
      animation: jiggle 0.5s infinite;
      z-index: 10;
    }

    @keyframes jiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-7deg) translateY(-3px); }
      50% { transform: rotate(7deg) translateY(-1px); }
      75% { transform: rotate(-4deg) translateY(-2px); }
    }

    /* Ball colors */
    .red { --ball-color: #f04450; --dark-color: #a92335; }
    .pink { --ball-color: #ed819b; --dark-color: #b94f6c; }
    .orange { --ball-color: #f17a20; --dark-color: #a9430c; }
    .yellow { --ball-color: #f2cc3f; --dark-color: #b88a13; }
    .green { --ball-color: #70a65a; --dark-color: #3b6c36; }
    .blue { --ball-color: #75a9d2; --dark-color: #345e8a; }
    .navy { --ball-color: #24528d; --dark-color: #10294f; }
    .purple { --ball-color: #b39aca; --dark-color: #73558e; }

    /* Ball positions */
    .b1 { left: 17%; top: 13%; width: 68px; height: 68px; }
    .b2 { left: 29%; top: 15%; width: 56px; height: 56px; }
    .b3 { left: 22%; top: 24%; width: 39px; height: 39px; }
    .b4 { left: 15%; top: 31%; width: 54px; height: 54px; }
    .b5 { left: 28%; top: 28%; width: 41px; height: 41px; }
    .b6 { left: 65%; top: 9%; width: 74px; height: 74px; }
    .b7 { left: 75%; top: 22%; width: 58px; height: 58px; }
    .b8 { left: 49%; top: 16%; width: 55px; height: 55px; }
    .b9 { left: 50%; top: 50%; width: 57px; height: 57px; }
    .b10 { left: 54%; top: 52%; width: 46px; height: 46px; }
    .b11 { left: 55%; top: 40%; width: 72px; height: 72px; }
    .b12 { left: 36%; top: 58%; width: 46px; height: 46px; }
    .b13 { left: 79%; top: 48%; width: 47px; height: 47px; }
    .b14 { left: 90%; top: 54%; width: 74px; height: 74px; }
    .b15 { left: 84%; top: 60%; width: 49px; height: 50px; }
    .b16 { left: 80%; top: 61%; width: 44px; height: 44px; }
    .b17 { left: 40%; top: 76%; width: 80px; height: 80px; }
    .b18 { left: 53%; top: 78%; width: 58px; height: 58px; }
    .b19 { left: 50%; top: 88%; width: 42px; height: 42px; }
    .b20 { left: 70%; top: 89%; width: 40px; height: 40px; }
    .b21 { left: 75%; top: 80%; width: 72px; height: 72px; }
    .b22 { left: 80%; top: 88%; width: 46px; height: 46px; }
    .b23 { left: 5%; top: 63%; width: 78px; height: 78px; }
    .b24 { left: 10%; top: 70%; width: 49px; height: 49px; }
    .b25 { left: 70%; top: 25%; width: 45px; height: 45px; }
    .b26 { left: 17%; top: 60%; width: 44px; height: 44px; }
    .b27 { left: 85%; top: 83%; width: 44px; height: 44px; }
    .b28 { left: 35%; top: 88%; width: 49px; height: 49px; }

    .footer {
      position: absolute;
      right: 34px;
      bottom: 24px;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 700px) {
      .page { padding: 20px 16px 48px; }
      .artwork { height: 900px; min-height: 650px; }
      .footer { right: 16px; bottom: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="note"><br> </p>
<link rel="stylesheet" href="Kongplay.css">
    <section class="artwork">
      <!-- White platforms -->
      <div class="platform one"></div>
      <div class="platform two"></div>
      <div class="platform three"></div>
      <div class="platform four"></div>
      <div class="platform five"></div>
      <div class="platform six"></div>
      <div class="platform seven"></div>
      <div class="platform eight"></div>

      <!-- Colorful balls -->
      <div class="ball red b1"></div>
      <div class="ball blue b2"></div>
      <div class="ball yellow b3"></div>
      <div class="ball green b4"></div>
      <div class="ball purple b5"></div>
      <div class="ball orange b6"></div>
      <div class="ball pink b7"></div>
      <div class="ball navy b8"></div>
      <div class="ball red b9"></div>
      <div class="ball pink b10"></div>
      <div class="ball blue b11"></div>
      <div class="ball yellow b12"></div>
      <div class="ball red b13"></div>
      <div class="ball purple b14"></div>
      <div class="ball navy b15"></div>
      <div class="ball green b16"></div>
      <div class="ball red b17"></div>
      <div class="ball orange b18"></div>
      <div class="ball blue b19"></div>
      <div class="ball purple b20"></div>
      <div class="ball yellow b21"></div>
      <div class="ball pink b22"></div>
      <div class="ball purple b23"></div>
      <div class="ball navy b24"></div>
      <div class="ball purple b25"></div>
      <div class="ball orange b26"></div>
      <div class="ball orange b27"></div>
      <div class="ball green b28"></div>
    </section>

    <div class="footer">
      <i><span>° Kong Play. 2025.</span></i>
      <span>° Gossiaux, Emilie Louise </span>
    </div>
  </main>
</body>
</html>
